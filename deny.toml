[graph]
all-features = true

[licenses]
allow = ["MIT", "Apache-2.0", "BSD-2-Clause", "BSD-3-Clause", "ISC", "Zlib", "Unicode-3.0", "MPL-2.0", "BSL-1.0", "MIT-0", "OFL-1.1", "Ubuntu-font-1.0"]

[bans]
multiple-versions = "warn"
deny = [
    { crate = "bevy", wrappers = ["strata_client", "strata_render"] },
    { crate = "mlua", wrappers = ["strata_lua"] },
]

[advisories]
ignore = [
    # `paste` is a compile-time proc macro pulled in by `full_moon` (approved for `strata lint`).
    # It is archived but has no known vulnerability and no code in the shipped binary.
    { id = "RUSTSEC-2024-0436", reason = "unmaintained proc macro used by full_moon at build time" },
    # `ttf-parser` is pulled in by Bevy's text stack (`strata_client` only). Unmaintained, no known vulnerability.
    { id = "RUSTSEC-2026-0192", reason = "unmaintained font parser used by Bevy text rendering" },
]
