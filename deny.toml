[graph]
all-features = true

[licenses]
allow = ["MIT", "Apache-2.0", "BSD-2-Clause", "BSD-3-Clause", "ISC", "Zlib", "Unicode-3.0", "MPL-2.0", "BSL-1.0", "MIT-0", "OFL-1.1", "Ubuntu-font-1.0"]

[bans]
multiple-versions = "warn"
deny = [
    { crate = "bevy", wrappers = ["strata_client", "strata_render"] },
    { crate = "mlua", wrappers = ["strata_lua"] },
]

[advisories]
ignore = [
    # `ttf-parser` comes from Bevy's `wayland` feature (winit's adwaita window decorations), in
    # `strata_client` only. Unmaintained, no known vulnerability. Tracked in #171.
    { id = "RUSTSEC-2026-0192", reason = "unmaintained font parser used by Bevy's Wayland window decorations" },
]
