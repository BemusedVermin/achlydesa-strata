name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: fmt + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Detect Cargo workspace
        id: ws
        shell: bash
        run: |
          if [ -f Cargo.toml ]; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "present=false" >> "$GITHUB_OUTPUT"; fi

      - name: No workspace yet
        if: steps.ws.outputs.present != 'true'
        run: echo "No Cargo.toml yet (T-001 creates it); skipping Rust checks."

      - name: Install Rust (reads rust-toolchain.toml)
        if: steps.ws.outputs.present == 'true'
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: rustfmt, clippy

      - name: Linux packages for Bevy and vendored Lua
        if: steps.ws.outputs.present == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev

      - name: rustfmt
        if: steps.ws.outputs.present == 'true'
        run: cargo fmt --all -- --check

      - name: clippy
        if: steps.ws.outputs.present == 'true'
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Detect Cargo workspace
        id: ws
        shell: bash
        run: |
          if [ -f Cargo.toml ]; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "present=false" >> "$GITHUB_OUTPUT"; fi

      - name: Install Rust (reads rust-toolchain.toml)
        if: steps.ws.outputs.present == 'true'
        uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Linux packages for Bevy and vendored Lua
        if: steps.ws.outputs.present == 'true' && runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev

      # Bevy is only built on Linux (the client crate is the only one that needs it); the other
      # systems test the default members, which is everything else.
      - name: cargo test (core crates)
        if: steps.ws.outputs.present == 'true' && runner.os != 'Linux'
        run: cargo test --locked --profile ci

      - name: cargo test (workspace, including the client)
        if: steps.ws.outputs.present == 'true' && runner.os == 'Linux'
        run: cargo test --workspace --locked --profile ci

      - name: toy pack tests (Rust and Lua combat)
        if: steps.ws.outputs.present == 'true'
        run: cargo run --locked --profile ci -p strata_cli -- pack test fixtures/packs/toy

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Detect deny.toml
        id: ws
        shell: bash
        run: |
          if [ -f Cargo.toml ] && [ -f deny.toml ]; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "present=false" >> "$GITHUB_OUTPUT"; fi

      - name: cargo deny check
        if: steps.ws.outputs.present == 'true'
        uses: EmbarkStudios/cargo-deny-action@v2
