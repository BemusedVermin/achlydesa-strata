name: Claude PR review

# Advisory review of every non-draft PR targeting master, before Liam reviews it.
on:
  pull_request:
    branches: [master]
    types: [opened, synchronize, ready_for_review, reopened]

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    # Skip drafts and PRs from forks (forks get no secrets on a public repo).
    if: >-
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # To bill a Claude subscription instead, replace the line above with:
          # claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          track_progress: true
          claude_args: |
            --model ${{ vars.CLAUDE_REVIEW_MODEL || 'claude-opus-5-5' }}
            --max-turns 40
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh issue view:*),Bash(git diff:*),Bash(git log:*),Bash(python3 scripts/line_budget.py:*),Read,Grep,Glob"
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            You are the first reviewer for the Strata engine. A human maintainer reviews after you,
            so your job is to catch problems early and make his review fast. You do not approve or merge.

            Read first:
            - CLAUDE.md (process, the 500-line rule, determinism rules)
            - The issue this PR closes (find "Closes #N" in the PR body; read it with `gh issue view N`)
            - The design sections that issue cites, in docs/design/strata-engine.md

            Check, in this order:
            1. Scope: does the PR do what the issue asks, all of it, and nothing outside it?
               Every acceptance criterion must be met and covered by a test.
            2. Correctness: logic errors, edge cases, panics on valid input, off-by-one, overflow in
               integer geometry (i128 where the design calls for it).
            3. Determinism: no floats, HashMap/HashSet, clocks, `rand`, unsafe, or iteration-order
               dependence in core crates; state mutated only through events; Lua holds no state.
            4. Architecture: crate layering from CLAUDE.md; Bevy only in strata_client; mlua only in
               strata_lua; names and data shapes match the design doc.
            5. Tests: meaningful assertions, property tests for math, no tests that merely restate the code.
            6. Budget: run `python3 scripts/line_budget.py --base origin/master` and flag any attempt to
               dodge it (logic in test files, compressed formatting, inline test modules).

            How to report:
            - Post line-specific findings as inline comments with mcp__github_inline_comment__create_inline_comment.
              Prefix each with BLOCKING, SHOULD or NIT.
            - Then post one summary comment with `gh pr comment` containing: a one-line verdict
              ("Ready for human review" or "Changes needed"), the list of BLOCKING items, and anything
              the human reviewer should look at closely. Keep it short.
            - Do not comment on formatting that rustfmt or clippy already enforce.
