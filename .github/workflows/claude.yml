name: Claude implementer

# Lets the maintainer delegate work by commenting "@claude implement this issue" on an issue,
# or "@claude <request>" on a PR. Only the repo owner, members and collaborators can trigger it.
on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  claude:
    if: >-
      contains(github.event.comment.body, '@claude') &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust (reads rust-toolchain.toml)
        if: hashFiles('rust-toolchain.toml') != ''
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: rustfmt, clippy

      - name: Install stable Rust (before T-001 adds rust-toolchain.toml)
        if: hashFiles('rust-toolchain.toml') == ''
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Linux packages for Bevy and vendored Lua
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: |
            --model ${{ vars.CLAUDE_IMPL_MODEL || 'claude-sonnet-5-5' }}
            --max-turns 200
            --allowedTools "Bash(cargo:*),Bash(python3 scripts/line_budget.py:*),Bash(git status:*),Bash(git diff:*),Bash(git log:*),Bash(gh issue view:*),Edit,Write,Read,Grep,Glob"
