[package]
name = "strata_cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
strata_kernel = { path = "../strata_kernel" }
strata_model = { path = "../strata_model" }
strata_rules = { path = "../strata_rules" }
strata_modules = { path = "../strata_modules" }
strata_lua = { path = "../strata_lua" }
strata_content = { path = "../strata_content" }
strata_session = { path = "../strata_session" }
strata_ai = { path = "../strata_ai" }
strata_editor = { path = "../strata_editor" }
clap = { version = "4", features = ["derive"] }
miette = { version = "7", features = ["fancy"] }
full_moon = { version = "3", features = ["lua54"] }

[dev-dependencies]
assert_cmd = "2"
tempfile = "3"
insta = "1"

[[bin]]
name = "strata"
path = "src/main.rs"
