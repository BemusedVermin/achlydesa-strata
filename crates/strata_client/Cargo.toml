[package]
name = "strata_client"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[features]
# Local iteration only: links Bevy dynamically. CI and release builds must not enable it.
dev = ["bevy/dynamic_linking"]

[dependencies]
strata_kernel = { path = "../strata_kernel" }
strata_model = { path = "../strata_model" }
strata_rules = { path = "../strata_rules" }
strata_modules = { path = "../strata_modules" }
strata_lua = { path = "../strata_lua" }
strata_content = { path = "../strata_content" }
strata_session = { path = "../strata_session" }
strata_ai = { path = "../strata_ai" }
strata_editor = { path = "../strata_editor" }
bevy = { version = "=0.20.1", default-features = false, features = [
    "default_app",
    "std",
    "bevy_winit",
    "bevy_clipboard",
    "default_font",
    "multi_threaded",
    "x11",
    "wayland",
    # What the 2.5D scene needs: ortho camera, lit meshes, billboard quads, egui. Left out on purpose
    # (they pull in much of the build): gltf, scene, picking, animation, gizmos, anti-aliasing,
    # post-processing, gilrs, audio. Add one back here when a feature needs it.
    "bevy_render",
    "bevy_core_pipeline",
    "bevy_pbr",
    "bevy_light",
    "bevy_camera",
    "bevy_mesh",
    "bevy_image",
    "bevy_color",
    "bevy_shader",
    "bevy_material",
    "bevy_window",
    "bevy_text",
    "png",
    "tonemapping_luts",
    "ktx2",
    "zstd_rust",
] }
bevy_egui = "=0.43.1"
glam = "0.33.12"
clap = { version = "4", features = ["derive"] }

[[bin]]
name = "strata-client"
path = "src/main.rs"
