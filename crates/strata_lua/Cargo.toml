[package]
name = "strata_lua"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
strata_rules = { path = "../strata_rules" }
strata_kernel = { path = "../strata_kernel" }
strata_model = { path = "../strata_model" }
mlua = { version = "0.11", features = ["lua54", "vendored", "serde"] }
serde = { version = "1", features = ["derive"] }
serde_path_to_error = "0.1"
thiserror = "2"

[dev-dependencies]
insta = "1"
serde_json = "1"
tempfile = "3"
