[workspace]
resolver = "3"
members = ["crates/*"]
# Crates without Bevy: what a bare `cargo test` or `cargo build` covers.
# Use `--workspace` (as CI does) or `-p strata_client` to include the client.
default-members = [
    "crates/strata_kernel",
    "crates/strata_derive",
    "crates/strata_model",
    "crates/strata_rules",
    "crates/strata_modules",
    "crates/strata_lua",
    "crates/strata_content",
    "crates/strata_session",
    "crates/strata_ai",
    "crates/strata_editor",
    "crates/strata_cli",
]

[workspace.dependencies]
bevy = { version = "=0.20.1", default-features = false, features = [
    "default_app",
    "std",
    "bevy_winit",
    "bevy_clipboard",
    "default_font",
    "multi_threaded",
    "x11",
    "wayland",
    # What the 2.5D scene needs: ortho camera, lit meshes, billboard quads, egui. Left out on purpose
    # (they pull in much of the build): gltf, scene, picking, animation, gizmos, anti-aliasing,
    # post-processing, gilrs, audio. Add one back here when a feature needs it.
    "bevy_render",
    "bevy_core_pipeline",
    "bevy_pbr",
    "bevy_light",
    "bevy_camera",
    "bevy_mesh",
    "bevy_image",
    "bevy_color",
    "bevy_shader",
    "bevy_material",
    "bevy_window",
    "bevy_text",
    "png",
    "tonemapping_luts",
    "ktx2",
    "zstd_rust",
] }
glam = "0.33.12"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"

[profile.dev]
opt-level = 1
debug = "line-tables-only"

# opt-level 3 here made a clean Bevy build ~5x slower (30 min), so deps stay at 1.
[profile.dev.package."*"]
opt-level = 1

# CI only (`--profile ci`): nothing is optimised, so a cold Bevy build is as cheap as it gets.
[profile.ci]
inherits = "dev"
opt-level = 0
debug = false

[profile.ci.package."*"]
opt-level = 0
