disallowed-types = [
    { path = "std::collections::HashMap", reason = "iteration order is not deterministic; use BTreeMap or IndexMap" },
    { path = "std::collections::HashSet", reason = "iteration order is not deterministic; use BTreeSet or IndexSet" },
]
