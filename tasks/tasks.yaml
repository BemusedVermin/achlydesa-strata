  - id: T-006
    title: "Kernel: exact 2D segment traversal through the hex grid"
    milestone: "M0 Foundations"
    labels: [area:kernel, area:los, determinism]
    depends: [T-002]
    budget: 450
    doc: ["§7.5 Line of sight", "§7.6 Line of sight with sprites"]
    goal: "The exact-geometry heart of line of sight: which hex interiors a segment passes through, and where."
    scope:
      - "Work in axial coordinates scaled by `LATTICE = 15`, so hex centers, hex corners (denominator 3) and the corners of 80% inset hexes (denominator 15) are all integer points. Document why 15."
      - "`Frac` exact rational (`i128` numerator and denominator, normalized, total order) for segment parameters t ∈ [0, 1]."
      - "`traverse(a, b) -> Vec<Crossing { hex, t_in: Frac, t_out: Frac }>` in increasing t: every hex whose open interior the segment passes through. Grazing an edge or vertex does not count (§7.5 tie rule)."
      - "`clip_inset(hex, a, b) -> Option<(Frac, Frac)>`: where the segment crosses the open interior of the 80% inset hexagon of `hex` (needed for figure volumes)."
      - "Implement clipping as exact Cyrus–Beck against the six edge half-planes; enumerate candidate hexes without floats."
    acceptance:
      - "No floating point anywhere."
      - "Crossings are contiguous, ordered, and cover the segment's path through interiors."
    tests:
      - "proptest: reversing the segment reverses the crossings (with t ↦ 1 − t); rotating both endpoints by 60° rotates every crossing hex; every endpoint strictly inside a hex appears first or last."
      - "Hand cases: center to center along each axis; a segment running exactly along a shared edge crosses neither neighbor's interior; vertex grazing."

  - id: T-007
    title: "Kernel: 3D occlusion test for columns and figure volumes"
    milestone: "M0 Foundations"
    labels: [area:kernel, area:los, determinism]
    depends: [T-006]
    budget: 350
    doc: ["§7.5 Line of sight", "§7.6 Line of sight with sprites"]
    goal: "Decide exactly whether a 3D segment is blocked, given what stands in each column."
    scope:
      - "`Seg3`: two points with lattice x/y and z in sub-level units (12 per level)."
      - "`Blocker { footprint: FullHex | InsetHex, z0, z1 }` (half-open, sub-level units)."
      - "`blocked(seg, blockers: impl Fn(Hex) -> &[Blocker], ignore: &[Hex]) -> bool`: for each crossing, compute the segment's height interval over the crossing (exact, linear in t) and test overlap with the open interior of every blocker; inset blockers use `clip_inset`. Endpoint columns listed in `ignore` are skipped."
      - "`clear_count(origin, targets, ...)` returning how many target samples are unblocked, plus the clear segments as witnesses."
    acceptance:
      - "Touching a blocker's top, bottom or side does not block."
      - "Pure integer and rational arithmetic."
    tests:
      - "Hand-built cases: a wall of height 3 between two figures blocks low samples but not high ones; a bridge deck blocks a segment passing through it but not one passing under it."
      - "proptest: the result is invariant under 60° rotation of the whole scene and under swapping segment endpoints."

