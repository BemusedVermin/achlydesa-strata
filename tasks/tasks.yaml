  - id: T-066
    title: "`strata lint`: Lua checks"
    milestone: "M6 AI and tooling"
    labels: [area:cli, modding, determinism]
    depends: [T-019]
    budget: 400
    doc: ["§9.4 Determinism rules", "§8.4 Card text", "§16.1 CLI"]
    goal: "Catch nondeterministic or drifting Lua before it runs."
    scope:
      - "Parse pack Lua with `full_moon`."
      - "Errors: `/` division in logic files; assignments to upvalues inside functions stored in definitions (hooks); `pairs`-dependent side effects are out of scope."
      - "Warnings: an explicit `text = ...` override that omits a number present in the archetype parameters."
      - "Run `selene` with a generated Strata std definition if it is installed; skip with a notice otherwise."
    acceptance:
      - "Diagnostics name file, line and a fix."
    tests:
      - "Fixture Lua files for each check; snapshot of output."

  - id: T-067
    title: "Sprite lint: sprite height against the LOS profile"
    milestone: "M6 AI and tooling"
    labels: [area:cli, sprites, area:los]
    depends: [T-066, T-050]
    budget: 250
    doc: ["§7.6 Line of sight with sprites"]
    goal: "Guarantee the picture matches the rules."
    scope:
      - "For every figure with a sprite, load each direction's frames with `image`, measure the opaque bounding box from the foot anchor, convert with `pixels_per_level`, and compare against the hit zone."
      - "Fail if the height differs by more than one sub-level unit; fail if the width exceeds the footprint's projected width."
    acceptance:
      - "Generated fallback sprites always pass."
    tests:
      - "Fixture PNGs that pass, are too tall, and are too wide."

