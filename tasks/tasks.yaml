  # ---------------------------------------------------------------- M1
  - id: T-013
    title: "strata_lua: sandboxed Lua host"
    milestone: "M1 Lua data stage"
    labels: [area:lua, determinism]
    depends: [T-005]
    budget: 450
    doc: ["§9.3 Sandbox", "§9.4 Determinism rules"]
    goal: "A Lua 5.4 host that cannot do anything nondeterministic or unsafe."
    scope:
      - "`mlua` with features `lua54`, `vendored`, `serde`. `LuaHost::new(Limits)` creating a state with only base, `string`, `table`, `math` and `utf8`."
      - "Remove `io`, `os`, `debug`, `package`, `coroutine`, `dofile`, `loadfile`, `load`, `collectgarbage`, `math.random`, `math.randomseed`, `next`; replace `pairs` with a version that iterates keys in sorted order (numbers before strings, each ascending)."
      - "Per-pack environments built from the sandbox globals, with `freeze(table)` making a table read-only (writes raise)."
      - "Deterministic per-call instruction budget via mlua's instruction-count hook, and `set_memory_limit`."
      - "A `Halt` sentinel userdata; `pcall`/`xpcall` replacements that rethrow it."
      - "Conversion `lua_to_value` / `value_to_lua` (T-005 `Value`) rejecting floats, NaN and functions with a typed error."
    acceptance:
      - "Two states that insert the same keys in different orders iterate them identically with `pairs`."
      - "An infinite loop aborts after the same instruction count every run."
      - "A script cannot swallow `Halt` with `pcall`."
    tests:
      - "One test per removed library and function; sorted pairs; budget; memory limit; float rejection; halt rethrow."

  - id: T-014
    title: "Pack discovery, manifests and dependency resolution"
    milestone: "M1 Lua data stage"
    labels: [area:content]
    depends: [T-013]
    budget: 350
    doc: ["§4.1 Layout", "§4.2 Manifest", "§4.3 Load stages (step 1)"]
    goal: "Find packs and decide the order they load in."
    scope:
      - "Scan one or more pack roots for directories containing `pack.lua`."
      - "Evaluate `pack.lua` in an empty environment (no globals at all) and convert the returned table into `PackManifest { id, version, name, engine, dependencies, visibility }` using `semver`."
      - "Resolve: missing dependency, version mismatch, duplicate IDs, cycles, and engine-range mismatch against `strata_content::ENGINE_VERSION` are errors naming the pack and file."
      - "Topological load order with ties broken by pack ID."
    acceptance:
      - "Resolution is a pure function of the manifests (directory listing order does not matter)."
    tests:
      - "Fixture packs under `fixtures/packs/` covering each error and a diamond dependency with tie-breaking."

  - id: T-015
    title: "Data stage: constructors, the data table and pack-scoped require"
    milestone: "M1 Lua data stage"
    labels: [area:content, area:lua]
    depends: [T-014]
    budget: 450
    doc: ["§4.3 Load stages (steps 2–4)", "§4.4 IDs", "§10.1 Conventions"]
    goal: "Run the three data stages and collect every definition with its source location."
    scope:
      - "Run `data.lua`, then `data_updates.lua`, then `data_final.lua` for all packs in load order (later stages optional per pack)."
      - "A constructor registry: each kind (`stat`, `die`, `terrain`, `unit`, ...) registers a Lua global that validates required fields cheaply and records the table into `data[kind][full_id]`, capturing the caller's file and line via `Lua::inspect_stack`."
      - "Namespaced ID resolution: bare IDs resolve to the current pack, then dependencies in declared order; ambiguity is an error."
      - "`data.each(kind, filter)` iterating in ID order; raw `pairs(data)` raises an error that points at `data.each`."
      - "Pack-scoped `require` resolving only within the pack and its declared dependencies, caching and freezing module tables."
    acceptance:
      - "Edits made in `data_updates.lua` are visible to later packs and to the freeze."
      - "Every record knows the file and line that created it."
    tests:
      - "Stage ordering; cross-pack edits; ambiguous-ID error; `require` boundary error; source locations."

  - id: T-016
    title: "Freeze: convert records to typed definitions and extract ScriptRefs"
    milestone: "M1 Lua data stage"
    labels: [area:content, area:lua]
    depends: [T-015, T-009]
    budget: 350
    doc: ["§4.3 Load stages (step 5)", "§9.1 Loader and runtime states"]
    goal: "Turn Lua tables into the typed structs from T-008 and T-009, without losing where anything came from."
    scope:
      - "Walk each record; replace every Lua function with `ScriptRef { pack, def, path }`, where `path` is a stable `/`-separated route through the record (for example `unit:ironclad_line/abilities/2/after/figure_destroyed`). Document the path grammar."
      - "Deserialize the function-free table into the typed struct via mlua's serde support."
      - "Map serde errors to `LoadError { file, line, field_path, message }`."
    acceptance:
      - "Every error names file, line and field path."
      - "ScriptRef paths are identical across runs and machines."
    tests:
      - "A fixture pack with one error of each kind (missing field, wrong type, float, unknown field) asserting the exact error text with insta."

  - id: T-017
    title: "Reference resolution and the ContentRegistry"
    milestone: "M1 Lua data stage"
    labels: [area:content]
    depends: [T-016]
    budget: 350
    doc: ["§4.4 IDs", "§4.3 Load stages (step 5)"]
