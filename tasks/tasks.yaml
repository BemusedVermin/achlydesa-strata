# Strata engine task list. Rendered to tasks/T-*.md and created as GitHub issues by
# scripts/create_issues.py. Each task is one PR with at most 500 lines of core logic.

milestones:
  - title: "M0 Foundations"
    description: "Workspace, kernel geometry and RNG, model types, determinism lints. Gate: geometry property tests pass; identical golden hashes on Linux, macOS and Windows."
  - title: "M1 Lua data stage"
    description: "mlua sandbox, pack resolution, data stages, freeze, registry, stubs, `strata pack validate`. Gate: every load error names its file and line."
  - title: "M2 Rules core"
    description: "Registrar, queries, resolver with answer tape, phases, descriptors, windows, Lua bridge, pack tests. Gate: pack tests pass with one slot swapped between Rust and Lua."
  - title: "M3 Standard rules and archetypes"
    description: "Rust modules for every slot, the eight archetype families, strata_std content, session, determinism harness. Gate: 1,000 self-play games with zero hash mismatches."
  - title: "M4 Playable client"
    description: "Bevy 2.5D isometric client with sprite figures, playback, previews, decision UI and hotseat flow. Gate: a full hotseat match with zero art assets."
  - title: "M5 Map editor"
    description: "Editor core, validation, Lua writer, editor UI. Gate: build, validate and playtest a map without leaving the app."
  - title: "M6 AI and tooling"
    description: "Greedy AI, balance sim, coverage stats, rules inspector, hot reload, lints, replay tools. Gate: the AI beats a random player in 90% of games."
  - title: "M7 Release readiness"
    description: "Release packaging. Gate: a distributable build."
  - title: "Post-1.0"
    description: "Work after the engine ships."

tasks:
  # ---------------------------------------------------------------- M0
  - id: T-001
    title: "Workspace skeleton, toolchain and determinism lints"
    milestone: "M0 Foundations"
    labels: [area:workspace]
    depends: []
    budget: 120
    doc: ["§3 Architecture", "§5.6 Determinism guards"]
    goal: "Create the Cargo workspace and every guard rail the later tasks rely on, so CI is meaningful from the first real PR."
    scope:
      - "Cargo workspace (edition 2024, resolver 3) with library crates `strata_kernel`, `strata_model`, `strata_rules`, `strata_modules`, `strata_lua`, `strata_content`, `strata_session`, `strata_ai`, `strata_editor`, proc-macro crate `strata_derive`, binary crate `strata_cli` (binary name `strata`) and binary crate `strata_client` (binary name `strata-client`, empty `main` for now; Bevy arrives in T-047)."
      - "Each crate depends only on the crates CLAUDE.md's layering allows; add the path dependencies now so the graph is fixed."
      - "`rust-toolchain.toml` pinning the current stable release (1.85 or later) with `rustfmt` and `clippy` components; `rustfmt.toml` with `edition = \"2024\"`."
      - "Every core crate's `lib.rs` (all but `strata_cli` and `strata_client`) starts with `#![forbid(unsafe_code)]`, `#![deny(clippy::float_arithmetic)]` and `#![warn(missing_docs)]`."
      - "`clippy.toml`: `disallowed-types` for `std::collections::HashMap` and `std::collections::HashSet`; `disallowed-methods` for `std::time::Instant::now` and `std::time::SystemTime::now`."
      - "`deny.toml`: permissive license allowlist (MIT, Apache-2.0, BSD-2-Clause, BSD-3-Clause, ISC, Zlib, Unicode-3.0, MPL-2.0); `[bans]` entries using `wrappers` so `bevy` may only be a dependency of `strata_client` and `mlua` only of `strata_lua`."
      - "`.gitignore` including `target/`; commit `Cargo.lock`; add a short Building section to README.md."
    acceptance:
      - "`cargo build --workspace`, `cargo clippy --workspace --all-targets -- -D warnings`, `cargo test --workspace` and `cargo deny check` pass on CI for Linux, macOS and Windows."
      - "Adding a `HashMap` to a core crate locally makes clippy fail (state in the PR that you verified this; do not commit it)."
      - "The crate dependency graph matches the layering in CLAUDE.md."
    tests:
      - "CI green is the test; no unit tests required."
    out_of_scope:
      - "Any real logic."

  - id: T-002
    title: "Kernel: hex coordinates, distances, rotations and footprints"
    milestone: "M0 Foundations"
    labels: [area:kernel]
    depends: [T-001]
    budget: 300
    doc: ["§7.1 Coordinates", "§7.3 Footprints"]
    goal: "Give every other crate one exact, integer hex vocabulary."
    scope:
      - "`Hex { q: i32, r: i32 }` with `s()`, the six neighbor directions in a fixed documented order, `neighbors()`, `distance()`, rotation by k×60° about the origin and about a center, reflection across an axis (for the editor's symmetry tool), `ring(radius)` and `spiral(radius)` in a deterministic order."
      - "`Space { q, r, z }` (z = level) and `Rotation(u8)` in 0..6."
      - "`Shape` (a list of axial offsets) with `rotated`, `translated`, `is_connected`, and a `common` module of named shapes (one, two-line, three-line, triangle, seven-hex flower)."
      - "Derive `Ord` so `Hex` and `Space` work as `BTreeMap` keys; serde support."
    acceptance:
      - "All operations are integer-only."
      - "Shapes rotate and translate without changing their cell count or connectivity."
    tests:
      - "proptest: distance is symmetric and satisfies the triangle inequality; every neighbor is at distance 1; rotation preserves distance; six 60° rotations are the identity; reflection twice is the identity; ring k has 6k cells for k ≥ 1."
    out_of_scope:
      - "Line traversal (T-006)."

  - id: T-003
    title: "Kernel: PCG32, bounded sampling, command RNG streams and stable hashing"
    milestone: "M0 Foundations"
    labels: [area:kernel, determinism]
    depends: [T-001]
    budget: 300
    doc: ["§5.4 Randomness", "§5.5 Hashing, snapshots and undo"]
    goal: "Own every bit of randomness and hashing so no dependency bump can ever change a replay."
    scope:
      - "Our own PCG32 (PCG-XSH-RR, 64-bit state, 32-bit output) with seed and stream selection."
      - "`bounded(n)` using Lemire's nearly-divisionless method with rejection; `roll(sides)` returning 1..=sides."
      - "`CommandRng::for_command(game_seed: u64, command_index: u32)` deriving the PCG seed and stream from an xxh3 hash of both values (document the exact derivation)."
      - "`StableHash` trait and `StableHasher` (xxh3-64 via `xxhash-rust`) with implementations for integers (little-endian), `bool`, `str`/`String` (length-prefixed), `Option`, `Vec`, slices, tuples up to 4, `BTreeMap`, `BTreeSet`, `IndexMap` (insertion order)."
    acceptance:
      - "PCG32 output matches the reference implementation's published test vectors; cite the source in the test."
      - "`bounded` never returns a value ≥ n and has no modulo bias."
      - "Hashing is independent of platform endianness and pointer width."
    tests:
      - "Known-answer test for PCG32."
      - "A deterministic chi-square sanity check of `bounded(6)` over a fixed seed."
      - "Golden-value tests for `StableHash` of a few fixed structures (constants committed)."
    out_of_scope:
      - "The derive macro (T-004)."

  - id: T-004
    title: "strata_derive: #[derive(StableHash)]"
    milestone: "M0 Foundations"
    labels: [area:kernel, determinism]
    depends: [T-003]
    budget: 200
    doc: ["§5.5 Hashing, snapshots and undo"]
    goal: "Make hashing a derive so new state types can't forget a field."
    scope:
      - "Proc-macro crate `strata_derive` (`syn`, `quote`, `proc-macro2`) exporting `#[derive(StableHash)]`, re-exported from `strata_kernel`."
      - "Structs hash fields in declaration order; enums hash the variant index as `u32` and then the variant's fields; tuple and unit structs supported; simple generics supported with `StableHash` bounds."
      - "`#[stable_hash(skip)]` attribute for caches that must not affect the hash."
    acceptance:
      - "Derived hashes equal hand-written hashes for the same field order."
      - "Reordering fields or adding a variant changes the hash (documented behavior)."
    tests:
      - "Unit tests on structs, enums, tuple structs, generics and `skip`, plus golden values."

  - id: T-005
    title: "Kernel: symbols, definition IDs and the Value type"
    milestone: "M0 Foundations"
    labels: [area:kernel]
    depends: [T-003, T-004]
    budget: 250
    doc: ["§4.4 IDs", "§5.1 Commands, events, decisions"]
    goal: "Provide the identifier and dynamic-value types every layer shares."
    scope:
