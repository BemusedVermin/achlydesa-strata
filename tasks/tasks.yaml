    goal: "The Bevy shell that talks to the simulation."
    scope:
      - "Add `bevy` (latest release at the time) and the matching `bevy_egui` to `strata_client` only; pin exact versions."
      - "`SimLinkPlugin`: starts a `SimHandle` from CLI args (packs, scenario, armies), drains outbound batches into a `PendingEvents` resource each frame, exposes a `SendCommand` event."
      - "Plugin skeletons for the other plugins in §13.3, empty for now."
    acceptance:
      - "`strata-client --pack packs/strata_std --scenario ...` opens a window and logs incoming events."
    tests:
      - "A headless Bevy `App` test with `MinimalPlugins` verifying the channel drain."

  - id: T-048
    title: "Isometric camera and kernel-based picking"
    milestone: "M4 Playable client"
    labels: [area:client]
    depends: [T-047]
    budget: 350
    doc: ["§13.8 Isometric rendering and sprites", "§13.3 Plugins"]
    goal: "The 2.5D view and exact hex picking."
    scope:
      - "Orthographic 3D camera at a configurable elevation (default 30°), six yaw steps of 60° with smooth turning, integer zoom steps, pan."
      - "World mapping from axial coordinates and levels (pointy or flat orientation from the map)."
      - "Picking: cast the cursor ray against compiled-board surfaces with kernel math (no physics) to get the hovered space; `HoveredSpace` resource."
    acceptance:
      - "The hovered space is correct on stacked terrain and under bridges from every yaw."
    tests:
      - "Unit tests for the ray-to-space math on a fixture board."

  - id: T-049
    title: "Terrain rendering"
    milestone: "M4 Playable client"
    labels: [area:client]
    depends: [T-048]
    budget: 450
    doc: ["§13.3 Plugins (BoardPlugin)", "§13.8 Isometric rendering and sprites"]
    goal: "Draw the compiled board."
    scope:
      - "Build hex-prism meshes per terrain material from `CompiledBoard`: top faces, and side faces only where exposed."
      - "Chunked meshes for large maps; rebuild only changed chunks on `BoardChanges`."
      - "Flat-shaded materials with nearest-neighbor textures from `assets.lua`, or tinted fallbacks."
      - "A level-slicing hook (hide segments above level N) for the editor."
    acceptance:
      - "Bridges and overhangs render with their gaps."
    tests:
      - "Unit tests for mesh face generation (exposed faces only) on fixture columns."

  - id: T-050
    title: "Sprite figures: billboards, directional frames and fallbacks"
    milestone: "M4 Playable client"
    labels: [area:client, sprites]
    depends: [T-049]
    budget: 450
    doc: ["§13.8 Isometric rendering and sprites", "§13.4 Asset fallbacks", "§7.6 Line of sight with sprites"]
    goal: "Every figure is an upright, camera-facing sprite that sorts correctly against terrain."
    scope:
      - "`sprite {}` metadata in `assets.lua` (sheet, frame size, foot anchor, six directions, animations); pack-level `pixels_per_level` and `hex_width_px`."
      - "Upright billboard quads that yaw with the camera, alpha-cutout materials so the depth buffer sorts them; anchored at the foot point on the figure's surface; scaled from pixels per level."
      - "Frame selection: direction = (figure rotation − camera yaw) mod 6; animation playback with `idle` fallback."
      - "Generated fallback sprites: a faction-colored capsule at the figure's hit-zone height in six directions, with a footprint-shaped base."
    acceptance:
      - "A fallback sprite's height on screen equals its hit-zone height in levels."
    tests:
      - "Unit tests for direction selection and pixel-to-world scaling."

  - id: T-051
    title: "Occlusion: silhouettes and column fading"
    milestone: "M4 Playable client"
    labels: [area:client, sprites]
    depends: [T-050]
